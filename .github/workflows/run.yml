name: sns
# 5분마다: 예약 스토리·피드 게시. 기록은 state/에 커밋한다. 이벤트 DM은 dm.yml.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sns
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      WHISTLE_STATE_DIR: state
      HASH_USERS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 토큰
        env:
          META: ${{ secrets.META_JSON }}
        run: |
          mkdir -p ~/.config/whistle
          printf '%s' "$META" > ~/.config/whistle/meta.json

      - name: 스토리·피드
        if: always()
        run: python3 post_story.py due

      - name: 기록 저장
        if: always()
        run: |
          git config user.name "whistle-sns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -q -m "state"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
          fi
